processed_dir: "processed_15_all"
outputs_dir: "outputs"

sequence_length: 30

step: 1
require_contiguous: true

model_type: "gru"   # "gru" or "lstm"
hidden_units: 128
dropout: 0.2
bidirectional: false

batch_size: 64
epochs: 30
learning_rate: 0.0001
patience: 7

